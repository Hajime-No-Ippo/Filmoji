services:
  db:
    image: ankane/pgvector
    container_name: filmoji-postgres
    environment:
      POSTGRES_DB: filmoji
      POSTGRES_USER: filmoji
      POSTGRES_PASSWORD: filmoji_pw
    ports:
      - "5412:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmoji"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - filmoji-network

  ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: filmoji-ai
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_URL: "postgresql://filmoji:filmoji_pw@db:5432/filmoji"
      DB_PASSWORD: filmoji_pw
      TMDB_API_KEY: "${TMDB_API_KEY}"
      TMDB_PAGES: "50"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - filmoji-network
    command: sh -c "python import_tmdb.py && python generate_vectors.py --table movies && uvicorn main:app --host 0.0.0.0 --port 8000"

  backend:
    build:
      context: ./filmoji-backend
      dockerfile: Dockerfile
    container_name: filmoji-backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      FIREBASE_CREDENTIALS_PATH: "/app/firebase-service-account.json" 
      DB_URL: "jdbc:postgresql://db:5432/filmoji"
      DB_USER: "${DB_USER:-filmoji}"
      DB_PASSWORD: "${DB_PASSWORD:-filmoji_pw}"
      TMDB_API_KEY: "${TMDB_API_KEY}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - filmoji-network

  frontend:
    build:
      context: ./filmoji-frontend
      dockerfile: Dockerfile
    container_name: filmoji-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - filmoji-network

volumes:
  postgres_data:

networks:
  filmoji-network:
    driver: bridge
