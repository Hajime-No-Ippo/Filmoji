services:
  db:
    image: ankane/pgvector
    container_name: filmoji-postgres
    environment:
      POSTGRES_DB: filmoji
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - filmoji-network

  ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: filmoji-ai
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_URL: "postgresql://postgres:postgres_password@db:5432/filmoji"
      DB_PASSWORD: postgres_password
      TMDB_API_KEY: "${TMDB_API_KEY}"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - filmoji-network
    command: sh -c "python import_tmdb.py && uvicorn main:app --host 0.0.0.0 --port 8000"

  backend:
    build:
      context: ./filmoji-backend
      dockerfile: Dockerfile
    container_name: filmoji-backend
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_URL: "jdbc:postgresql://db:5432/filmoji"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres_password}"
      TMDB_API_KEY: "${TMDB_API_KEY}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - filmoji-network

  frontend:
    build:
      context: ./filmoji-frontend
      dockerfile: Dockerfile
    container_name: filmoji-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - filmoji-network

volumes:
  postgres_data:

networks:
  filmoji-network:
    driver: bridge