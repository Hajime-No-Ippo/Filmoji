spring.application.name=backend

server.servlet.context-path=/api

# ── Database ──
spring.datasource.url=${DB_URL:jdbc:postgresql://DB_HOST:5432/filmoji}
spring.datasource.username=${DB_USER:DB_USER}
spring.datasource.password=${DB_PASSWORD:DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server Configuration
server.port=8080

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Firebase Configuration
firebase.project.id=${FIREBASE_PROJECT_ID:filmoji-7c2f1}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:/firebase-service-account.json}

# ── TMDB ──
tmdb.api.key=${TMDB_API_KEY:}
tmdb.base.url=https://api.themoviedb.org/3
tmdb.image.base.url=https://image.tmdb.org/t/p/w500

# ── HuggingFace ──
huggingface.api.token=${HUGGINGFACE_API_TOKEN:dev-mode}
huggingface.model.url=${HUGGINGFACE_MODEL_URL:https://api-inference.huggingface.co/models/sentence-transformers/all-MiniLM-L6-v2}

# Logging
logging.level.com.filmoji=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
