spring.application.name=backend
spring.banner.location=classpath:banner.txt

# ── Database ──
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/filmoji}
spring.datasource.username=${DATABASE_USER:filmoji}
spring.datasource.password=${DATABASE_PASSWORD:filmoji_pw}
spring.datasource.driver-class-name=org.postgresql.Driver


# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ── Firebase ──
firebase.project.id=${FIREBASE_PROJECT_ID:filmoji-7c2f1}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:./firebase-service-account.json}

# ── TMDB ──
tmdb.api.key=${TMDB_API_KEY:45d0ff281fa988a6838556f2cb51e078}
tmdb.base.url=https://api.themoviedb.org/3
tmdb.image.base.url=https://image.tmdb.org/t/p/w500

# ── HuggingFace ──
huggingface.api.token=${HUGGINGFACE_API_TOKEN:your_hf_token}
huggingface.model.url=https://router.huggingface.co/hf-inference/models/sentence-transformers/all-MiniLM-L6-v2/pipeline/feature-extraction

# ── CORS ──
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ── Logging ──
logging.level.com.filmoji=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
